name: Tag Approved Leander Version

on:
  push:
    branches:
      - main
    paths:
      - "leander-ppt/manifest.json"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate approved package
        working-directory: leander-ppt
        run: |
          node scripts/release-hygiene.js
          node templates/leander-ppt-scaffold/tools/lint-scope-hygiene.js --skill-root .
      - name: Create missing version tag
        shell: bash
        run: |
          version="$(node -p "require('./leander-ppt/manifest.json').version")"
          tag="leander-ppt-v${version}"
          echo "LEANDER_VERSION=${version}" >> "$GITHUB_ENV"
          echo "LEANDER_TAG=${tag}" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "Release Leander PPT ${version}"
            git push origin "${tag}"
          fi
      - name: Build clean archive and checksum
        shell: bash
        run: |
          tar -czf "leander-ppt-${LEANDER_TAG}.tar.gz" leander-ppt
          sha256sum "leander-ppt-${LEANDER_TAG}.tar.gz" > "leander-ppt-${LEANDER_TAG}.tar.gz.sha256"
      - name: Create or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="leander-ppt-${LEANDER_TAG}.tar.gz"
          checksum="${archive}.sha256"
          if gh release view "${LEANDER_TAG}" >/dev/null 2>&1; then
            gh release upload "${LEANDER_TAG}" "$archive" "$checksum" --clobber
          else
            args=(--generate-notes --target "${GITHUB_SHA}")
            if [[ "${LEANDER_VERSION}" == *-* ]]; then args+=(--prerelease); fi
            gh release create "${LEANDER_TAG}" "$archive" "$checksum" "${args[@]}"
          fi
