name: IInnovation-Products_ppt Feishu Notifications

on:
  workflow_run:
    workflows:
      - IInnovation-Products_ppt Team Sharing
      - Tag Approved IInnovation-Products_ppt Version
      - Release IInnovation-Products_ppt Skill
    types:
      - completed
  pull_request_target:
    types:
      - closed
  pull_request_review:
    types:
      - submitted
  repository_dispatch:
    types:
      - iinnovation_products_ppt_local_alert
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted notification code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send lifecycle notification to Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node team-sharing/scripts/notify-feishu-event.js
