<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Single gate outcome router layout preview</title>
  <desc id="desc">Three evidence inputs converge on one decision gate and then split into three mutually exclusive outcomes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7f8fa3"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d71920"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#f6f3ee"/>
  <text x="70" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f3a5f">Single Gate Outcome Router</text>
  <text x="70" y="91" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Editable page pattern · multiple inputs → one decision boundary → mutually exclusive outcomes</text>

  <text x="86" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#64748b">INPUTS</text>
  <text x="492" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#d71920">DECISION GATE</text>
  <text x="837" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#64748b">OUTCOMES</text>

  <g filter="url(#shadow)">
    <rect x="80" y="170" width="275" height="82" rx="14" fill="#ffffff" stroke="#cbd5df"/>
    <rect x="80" y="277" width="275" height="82" rx="14" fill="#ffffff" stroke="#cbd5df"/>
    <rect x="80" y="384" width="275" height="82" rx="14" fill="#ffffff" stroke="#cbd5df"/>
  </g>
  <circle cx="111" cy="211" r="13" fill="#e8eef5"/>
  <circle cx="111" cy="318" r="13" fill="#e8eef5"/>
  <circle cx="111" cy="425" r="13" fill="#e8eef5"/>
  <text x="111" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3a5f">1</text>
  <text x="111" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3a5f">2</text>
  <text x="111" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3a5f">3</text>
  <text x="139" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f3a5f">Evidence input A</text>
  <text x="139" y="229" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Replaceable evidence or signal</text>
  <text x="139" y="312" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f3a5f">Evidence input B</text>
  <text x="139" y="336" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Replaceable evidence or signal</text>
  <text x="139" y="419" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f3a5f">Evidence input C</text>
  <text x="139" y="443" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Up to four input cards</text>

  <path d="M355 211 H418 Q438 211 438 231 V290" fill="none" stroke="#7f8fa3" stroke-width="2"/>
  <path d="M355 318 H450" fill="none" stroke="#7f8fa3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M355 425 H418 Q438 425 438 405 V346" fill="none" stroke="#7f8fa3" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="465" y="242" width="255" height="152" rx="24" fill="#fff1f2" stroke="#d71920" stroke-width="2"/>
  </g>
  <circle cx="592.5" cy="278" r="17" fill="#d71920"/>
  <path d="M587 278 l4 4 8 -9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="592.5" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#d71920">Single decision gate</text>
  <text x="592.5" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f3a5f">Evaluate once, then route</text>

  <path d="M720 318 H765 Q785 318 785 298 V211 H830" fill="none" stroke="#7f8fa3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M720 318 H830" fill="none" stroke="#7f8fa3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M720 318 H765 Q785 318 785 338 V425 H830" fill="none" stroke="#d71920" stroke-width="2" marker-end="url(#arrow-red)"/>

  <g filter="url(#shadow)">
    <rect x="845" y="170" width="275" height="82" rx="14" fill="#ffffff" stroke="#93a5ba"/>
    <rect x="845" y="277" width="275" height="82" rx="14" fill="#ffffff" stroke="#93a5ba"/>
    <rect x="845" y="384" width="275" height="82" rx="14" fill="#fff1f2" stroke="#d71920"/>
  </g>
  <rect x="866" y="191" width="8" height="40" rx="4" fill="#1f3a5f"/>
  <rect x="866" y="298" width="8" height="40" rx="4" fill="#7f8fa3"/>
  <rect x="866" y="405" width="8" height="40" rx="4" fill="#d71920"/>
  <text x="891" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f3a5f">Direct route</text>
  <text x="891" y="229" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Continue through the standard path</text>
  <text x="891" y="312" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f3a5f">Review route</text>
  <text x="891" y="336" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Pause for a focused decision</text>
  <text x="891" y="419" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#d71920">Blocked route</text>
  <text x="891" y="443" font-family="Arial, sans-serif" font-size="13" fill="#7f1d1d">Stop before the protected action</text>

  <rect x="80" y="520" width="1040" height="72" rx="16" fill="#e8eef5"/>
  <text x="600" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f3a5f">BOUNDARY NOTE</text>
  <text x="600" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52606d">Each item follows one outcome only; the protected action stays outside this component.</text>
  <text x="1120" y="638" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7b8794">Schematic candidate preview · production use remains blocked until curator approval</text>
</svg>
